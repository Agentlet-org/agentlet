<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Robot head -->
  <rect x="4" y="6" width="12" height="10" rx="2" fill="none" stroke="context-fill" stroke-width="1.5"/>
  <!-- Antenna -->
  <line x1="10" y1="6" x2="10" y2="3" stroke="context-fill" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="10" cy="2.5" r="1" fill="context-fill"/>
  <!-- Eyes -->
  <circle cx="7" cy="10" r="1.5" fill="context-fill"/>
  <circle cx="13" cy="10" r="1.5" fill="context-fill"/>
  <!-- Mouth -->
  <line x1="7" y1="13" x2="13" y2="13" stroke="context-fill" stroke-width="1.5" stroke-linecap="round"/>
</svg>
